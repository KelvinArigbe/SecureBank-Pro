name: SecureBank Pro Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  bicep-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bicep CLI
        run: az bicep install

      - name: Compile Bicep templates
        run: |
          az bicep build --file bicep/step2-secrets-and-db.bicep
          az bicep build --file bicep/step3-app-and-identity.bicep
          az bicep build --file bicep/step4-monitoring.bicep
